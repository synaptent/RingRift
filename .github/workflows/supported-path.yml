name: Supported Path

on:
  push:
    branches: [main, develop]
    paths:
      - 'README.md'
      - 'QUICKSTART.md'
      - 'CONTRIBUTING.md'
      - 'docs/RESULTS.md'
      - 'docs/ARCHITECTURE_OVERVIEW.md'
      - 'docs/REPOSITORY_MAP.md'
      - 'docs/INDEX.md'
      - 'DOCUMENTATION_INDEX.md'
      - 'ai-service/README.md'
      - 'ai-service/docs/README.md'
      - 'scripts/run_proven_experiment.sh'
      - 'scripts/check_supported_path.sh'
      - 'ai-service/scripts/minimal_alphazero_loop.py'
      - 'ai-service/app/training/train_cli.py'
      - 'src/shared/engine/**'
      - 'src/shared/types/**'
      - '.github/workflows/supported-path.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'README.md'
      - 'QUICKSTART.md'
      - 'CONTRIBUTING.md'
      - 'docs/RESULTS.md'
      - 'docs/ARCHITECTURE_OVERVIEW.md'
      - 'docs/REPOSITORY_MAP.md'
      - 'docs/INDEX.md'
      - 'DOCUMENTATION_INDEX.md'
      - 'ai-service/README.md'
      - 'ai-service/docs/README.md'
      - 'scripts/run_proven_experiment.sh'
      - 'scripts/check_supported_path.sh'
      - 'ai-service/scripts/minimal_alphazero_loop.py'
      - 'ai-service/app/training/train_cli.py'
      - 'src/shared/engine/**'
      - 'src/shared/types/**'
      - '.github/workflows/supported-path.yml'
  workflow_dispatch: {}

jobs:
  supported-path:
    name: Supported path smoke + core gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHON: python3
      RINGRIFT_RULES_MODE: ts
      ORCHESTRATOR_ADAPTER_ENABLED: 'true'
      ORCHESTRATOR_ROLLOUT_PERCENTAGE: 100

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Python dependencies
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run supported path checks
        run: bash scripts/check_supported_path.sh
