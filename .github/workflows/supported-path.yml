name: Supported Path

on:
  push:
    branches: [main, develop]
    paths:
      - 'README.md'
      - 'QUICKSTART.md'
      - 'CONTRIBUTING.md'
      - 'docs/REVIEWER_GUIDE.md'
      - 'docs/RESULTS.md'
      - 'docs/REPRODUCIBILITY.md'
      - 'docs/PROJECT_BRIEF.md'
      - 'docs/RESEARCH_SNAPSHOT.md'
      - 'docs/ARCHITECTURE_OVERVIEW.md'
      - 'docs/REPOSITORY_MAP.md'
      - 'docs/INDEX.md'
      - 'docs/data/results_snapshot.json'
      - 'docs/data/results_evidence_manifest.json'
      - 'docs/data/reviewer_surface_manifest.json'
      - 'DOCUMENTATION_INDEX.md'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.supported-path.config.js'
      - 'jest.rules-coverage.config.js'
      - '.github/actions/setup-node/action.yml'
      - '.github/actions/setup-python-ai/action.yml'
      - 'ai-service/README.md'
      - 'ai-service/docs/README.md'
      - 'scripts/run_proven_experiment.sh'
      - 'scripts/check_supported_path.sh'
      - 'scripts/check_reviewer_surface.py'
      - 'scripts/build_reviewer_packet.py'
      - 'scripts/check_results_evidence.py'
      - 'scripts/check_python_training_contract_coverage.sh'
      - 'scripts/refresh_results_artifacts.py'
      - 'ai-service/scripts/minimal_alphazero_loop.py'
      - 'ai-service/scripts/deploy_minimal_loops.sh'
      - 'ai-service/scripts/fleet_health_check.py'
      - 'ai-service/scripts/minimal_loop_supervisor.sh'
      - 'ai-service/app/training/train_cli.py'
      - 'ai-service/tests/contracts/**'
      - 'ai-service/tests/unit/coordination/test_event_subscription_completeness.py'
      - 'ai-service/tests/unit/coordination/test_infrastructure_quality_contracts.py'
      - 'ai-service/tests/unit/scripts/test_deploy_minimal_loops.py'
      - 'ai-service/tests/unit/scripts/test_master_loop_profiles.py'
      - 'src/shared/engine/**'
      - 'src/shared/types/**'
      - '.github/workflows/supported-path.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'README.md'
      - 'QUICKSTART.md'
      - 'CONTRIBUTING.md'
      - 'docs/REVIEWER_GUIDE.md'
      - 'docs/RESULTS.md'
      - 'docs/REPRODUCIBILITY.md'
      - 'docs/PROJECT_BRIEF.md'
      - 'docs/RESEARCH_SNAPSHOT.md'
      - 'docs/ARCHITECTURE_OVERVIEW.md'
      - 'docs/REPOSITORY_MAP.md'
      - 'docs/INDEX.md'
      - 'docs/data/results_snapshot.json'
      - 'docs/data/results_evidence_manifest.json'
      - 'docs/data/reviewer_surface_manifest.json'
      - 'DOCUMENTATION_INDEX.md'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.supported-path.config.js'
      - 'jest.rules-coverage.config.js'
      - '.github/actions/setup-node/action.yml'
      - '.github/actions/setup-python-ai/action.yml'
      - 'ai-service/README.md'
      - 'ai-service/docs/README.md'
      - 'scripts/run_proven_experiment.sh'
      - 'scripts/check_supported_path.sh'
      - 'scripts/check_reviewer_surface.py'
      - 'scripts/build_reviewer_packet.py'
      - 'scripts/check_results_evidence.py'
      - 'scripts/check_python_training_contract_coverage.sh'
      - 'scripts/refresh_results_artifacts.py'
      - 'ai-service/scripts/minimal_alphazero_loop.py'
      - 'ai-service/scripts/deploy_minimal_loops.sh'
      - 'ai-service/scripts/fleet_health_check.py'
      - 'ai-service/scripts/minimal_loop_supervisor.sh'
      - 'ai-service/app/training/train_cli.py'
      - 'ai-service/tests/contracts/**'
      - 'ai-service/tests/unit/coordination/test_event_subscription_completeness.py'
      - 'ai-service/tests/unit/coordination/test_infrastructure_quality_contracts.py'
      - 'ai-service/tests/unit/scripts/test_deploy_minimal_loops.py'
      - 'ai-service/tests/unit/scripts/test_master_loop_profiles.py'
      - 'src/shared/engine/**'
      - 'src/shared/types/**'
      - '.github/workflows/supported-path.yml'
  workflow_dispatch: {}

jobs:
  supported-path:
    name: Supported path smoke + core gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHON: python3
      RINGRIFT_RULES_MODE: ts
      ORCHESTRATOR_ADAPTER_ENABLED: 'true'
      ORCHESTRATOR_ROLLOUT_PERCENTAGE: 100

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node toolchain
        uses: ./.github/actions/setup-node
        with:
          node-version: '20'
          run-prisma-generate: 'true'

      - name: Setup Python AI toolchain
        uses: ./.github/actions/setup-python-ai
        with:
          python-version: '3.10'
          extra-index-url: ''

      - name: Run supported path checks
        run: npm run test:fast
