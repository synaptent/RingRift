name: Setup Node
description: Set up Node.js, install dependencies, and optionally generate Prisma client.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: '20'
  working-directory:
    description: Directory where npm commands should run.
    required: false
    default: '.'
  install-command:
    description: Command used to install Node dependencies.
    required: false
    default: 'npm ci'
  run-prisma-generate:
    description: Whether to run `npx prisma generate` after installing dependencies.
    required: false
    default: 'false'
  cache-dependency-path:
    description: Dependency file used for npm cache invalidation.
    required: false
    default: 'package-lock.json'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Install Node dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.install-command }}

    - name: Generate Prisma client
      if: ${{ inputs.run-prisma-generate == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npx prisma generate
